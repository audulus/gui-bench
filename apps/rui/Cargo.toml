[package]
name = "rui-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace, so the rui stack resolves apart from every other app.
[workspace]

[dependencies]
# rui pinned to a rev of its `gui-bench-support` branch (audulus/rui#83), which adds what the
# scenarios need and the 0.7.0 release lacks: a window size and decorations, hover from pointer
# motion, wheel events, a scroll view, one-axis frames and text that wraps to its width.
rui = { git = "https://github.com/audulus/rui", rev = "1af9ae199668f94e269fa0c044a38af5735e5121" }

[profile.release]
debug = 1
