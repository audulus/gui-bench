[package]
name = "rui-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace, so the rui stack resolves apart from every other app.
[workspace]

[dependencies]
# rui with the parts the scenarios need that its 0.7.0 release lacks: a window size and
# decorations, hover from pointer motion, wheel events, a scroll view, one-axis frames and text
# that wraps to its width. They live on the `gui-bench-support` branch of rui; until that branch
# is published, a checkout of it sits next to this repository.
rui = { path = "../../../rui-gui-bench" }

[profile.release]
debug = 1
